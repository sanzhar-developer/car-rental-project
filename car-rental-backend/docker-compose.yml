services:
  postgres:
    image: postgres:15-alpine
    container_name: car-rental-postgres
    environment:
      POSTGRES_DB: car_rental_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - car-rental-network

  redis:
    image: redis:7-alpine
    container_name: car-rental-redis
    ports:
      - "6380:6379"
    networks:
      - car-rental-network

  app:
    build: .
    container_name: car-rental-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/car_rental_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: mySecretKeyForJWTTokenGenerationThatIsAtLeast256BitsLong12345678
      JWT_EXPIRATION: 86400000
    depends_on:
      - postgres
      - redis
    networks:
      - car-rental-network

volumes:
  postgres_data:

networks:
  car-rental-network:
    driver: bridge
